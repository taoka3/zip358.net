<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEMO005 | フォームの基本パーツ</title>
  <style>
    body {
      font-family: "Yu Gothic", Meiryo, sans-serif;
      background-color: #f2f9ff;
      color: #183e60;
      line-height: 1.8;
      padding: 32px;
      max-width: 640px;
      margin: 0 auto;
    }
    form {
      background: #ffffff;
      padding: 28px;
      border: 1px solid #cbdfee;
      border-radius: 10px;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #a9cce6;
      border-radius: 6px;
      font: inherit;
      box-sizing: border-box;
    }
    button {
      background-color: #187bb9;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #126aab;
    }
  </style>
</head>
<body>
  <h1>お問い合わせフォームの基本</h1>
  <p><code>&lt;label&gt;</code> の <code>for</code> 属性と、入力欄の <code>id</code> 属性を一致させると、ラベルをクリックしても入力欄が選択されます。</p>

  <form action="#" method="get">
    <div class="field">
      <label for="user-name">お名前</label>
      <input id="user-name" name="name" type="text" placeholder="例：山田 太郎" required>
    </div>

    <div class="field">
      <label for="user-email">メールアドレス</label>
      <input id="user-email" name="email" type="email" placeholder="example@zip358.net" required>
    </div>

    <div class="field">
      <label for="course">興味のあるコース</label>
      <select id="course" name="course">
        <option value="html">HTML &amp; CSS</option>
        <option value="js">JavaScript</option>
        <option value="php">PHP</option>
      </select>
    </div>

    <div class="field">
      <label for="message">メッセージ</label>
      <textarea id="message" name="message" rows="4" placeholder="学びたいことや質問を入力してください"></textarea>
    </div>

    <button type="submit">送信する</button>
  </form>
</body>
</html>
