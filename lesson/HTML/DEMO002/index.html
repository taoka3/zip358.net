<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEMO002 | リストとリンクの基本</title>
  <style>
    body {
      font-family: "Yu Gothic", Meiryo, sans-serif;
      background-color: #f2f9ff;
      color: #183e60;
      line-height: 1.8;
      padding: 32px;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      color: #187bb9;
      border-bottom: 2px solid #cbdfee;
      padding-bottom: 8px;
    }
    ul, ol {
      background: #ffffff;
      padding: 20px 20px 20px 40px;
      border: 1px solid #cbdfee;
      border-radius: 8px;
    }
    li {
      margin-bottom: 6px;
    }
    a {
      color: #187bb9;
      font-weight: bold;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    a:hover {
      color: #0d5a8a;
      background-color: #dcefff;
    }
  </style>
</head>
<body>
  <h1>リストとリンクの基本</h1>

  <h2>箇条書きリスト（ul / li）</h2>
  <p>順番を問わない項目を並べるときは <code>&lt;ul&gt;</code> を使います。</p>
  <ul>
    <li>HTML：ページの構造をつくる</li>
    <li>CSS：色や配置をデザインする</li>
    <li>JavaScript：ページに動きをつける</li>
  </ul>

  <h2>番号付きリスト（ol / li）</h2>
  <p>手順やランキングなど、順序があるときは <code>&lt;ol&gt;</code> を使います。</p>
  <ol>
    <li>ファイルを作成する（index.html）</li>
    <li>HTMLコードを書く</li>
    <li>ブラウザーで開いて確認する</li>
  </ol>

  <h2>リンク（aタグ）</h2>
  <p>
    <a href="https://zip358.net">zip358.net トップページへ移動</a>
    ／
    <a href="https://developer.mozilla.org/ja/" target="_blank" rel="noopener noreferrer">MDN Web Docs（別タブで開く）</a>
  </p>
</body>
</html>
